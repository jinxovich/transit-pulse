[project]
name = "transit-pulse"
version = "0.1.0"
description = "Предиктор задержек городского транспорта: NDTP-поток → ML-прогноз на 10–15 минут → дашборд диспетчера"
requires-python = ">=3.12"
dependencies = ["transit-core"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "pytest-asyncio>=0.24", "httpx>=0.27"]
ml = ["lightgbm>=4.5", "catboost>=1.2", "scikit-learn>=1.5", "onnxruntime>=1.19"]
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "prometheus-client>=0.21",
]
docs = ["sphinx>=8.0", "furo>=2024.8"]
gpu = ["torch>=2.5", "onnx>=1.17"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
transit-core = { workspace = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["transit_core", "scripts", "contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "services/replayer"]
