[project]
name = "transit-core"
version = "0.1.0"
description = "Общее ядро Transit Pulse: NDTP-кодек, расписание, признаки as-of T, контракт API"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pandas>=2.2", "numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transit_core"]
